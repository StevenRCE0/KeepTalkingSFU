[package]
name = "keeptalking-sfu"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "KeepTalking presence service with an embedded iroh relay."

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.2"
iroh-relay = { version = "1.2", features = ["server"] }
n0-future = "0.3"
rcgen = "0.14"
sha2 = "0.11"
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "kt-sfu"
path = "src/bin/kt-sfu.rs"

[[bin]]
name = "kt-probe"
path = "src/bin/kt-probe.rs"
